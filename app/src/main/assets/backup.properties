# 备份统一配置（UTF-8）；不得填写账号密码。修改后重新构建 APK。
# 设置页可覆盖服务器、目录和自动备份网络条件；密码仅在 App 内输入。
webdav.url=https://dav.jianguoyun.com/dav/
webdav.directory=CarRepairBackups
# 云端列表刷新与每次“加载更多”显示的版本数。
cloud.list.page.size=5
auto.interval.hours=24
auto.unmetered=false
retry.backoff.seconds=30
retry.max.attempts=5
network.connect.timeout.seconds=15
network.read.timeout.seconds=60
network.write.timeout.seconds=60
# 坚果云当前默认单文件限制为 500M；其它服务按实际限制修改。
cloud.max.archive.bytes=500000000
# 限制导入解压规模，防止损坏 ZIP 耗尽空间；超限明确报错，绝不丢弃照片。
local.max.archive.bytes=53687091200
restore.max.expanded.bytes=53687091200
restore.max.json.bytes=134217728
restore.max.entries=100000
# 首版只新增完整快照，保留全部历史版本，不自动删除云端文件。
retention.policy=keep_all
