# Milestone 6：百度车牌 OCR 默认参数（UTF-8，修改后重新构建）。
# 凭据在根目录 ocr-credentials.local.properties 配置，由 Gradle 生成到 BuildConfig；不要写入资产文件。
baidu.token.url=https://aip.baidubce.com/oauth/2.0/token
baidu.license.plate.url=https://aip.baidubce.com/rest/2.0/ocr/v1/license_plate
network.connect.timeout.seconds=15
network.read.timeout.seconds=30
network.write.timeout.seconds=30
network.call.timeout.seconds=60
token.refresh.margin.seconds=60
# 复用现有图片处理：最长边 1440～1920，质量支持 50 / 70 / 90；不影响服务照片设置。
image.max.edge=1920
image.jpeg.quality=90
# 百度要求最短边至少 15px，最长边不超过 4096px；编码后的表单保守按 8,000,000 字节限制。
image.min.side=15
request.max.form.bytes=8000000
# 多车牌逐个展示供人工选择；任何结果都必须确认，不自动保存车辆。
recognition.multi.detect=true
